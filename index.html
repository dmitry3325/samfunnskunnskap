<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Norsk" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="manifest" href="app.webmanifest" />
  <link rel="apple-touch-icon" href="icon-512.png?v=2" />
  <title>Samfunnskunnskap</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: #2a2a3a;
      --accent: #4f8ef7;
      --accent2: #7c5cbf;
      --text: #e8e8f0;
      --text2: #8888aa;
      --text3: #555570;
      --radius: 14px;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
      height:100dvh; overflow:hidden; display:flex; flex-direction:column;
    }

    /* ── Top bar ── */
    .topbar {
      display:flex; align-items:center; gap:10px;
      padding:10px 14px;
      padding-top:max(10px,env(safe-area-inset-top));
      background:var(--surface); border-bottom:1px solid var(--border);
      flex-shrink:0; z-index:100;
    }
    .btn-menu { width:34px;height:34px;border:none;background:none;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px;flex-shrink:0; }
    .btn-menu:active { background:var(--surface2); }
    .topbar-title { flex:1;font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .btn-speak-all {
      display:flex;align-items:center;gap:5px;
      padding:5px 10px; border:1px solid var(--border);
      background:var(--surface2); color:var(--text2);
      border-radius:20px; font-size:12px; cursor:pointer; flex-shrink:0;
    }
    .btn-speak-all:active { background:var(--border); }
    .btn-speak-all.speaking { color:var(--accent);border-color:var(--accent); }

    /* ── Layout ── */
    .app-body { display:flex; flex:1; overflow:hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width:272px; background:var(--surface);
      border-right:1px solid var(--border);
      display:flex; flex-direction:column; flex-shrink:0;
      transition:transform 0.28s cubic-bezier(.4,0,.2,1); overflow:hidden;
    }
    @media (max-width:700px) {
      .sidebar {
        position:fixed; top:0; left:0;
        width:84vw; max-width:300px; height:100dvh;
        z-index:200; transform:translateX(-100%);
        border-right:none; box-shadow:4px 0 24px rgba(0,0,0,.6);
      }
      .sidebar.open { transform:translateX(0); }
      .overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:199; }
      .overlay.show { display:block; }
    }
    .sidebar-header { padding:14px; padding-top:max(14px,env(safe-area-inset-top)); border-bottom:1px solid var(--border); flex-shrink:0; }
    .sidebar-logo { font-size:15px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px; }
    .sidebar-hint { font-size:11px;color:var(--text3);margin-top:5px;line-height:1.5; }
    .sidebar-nav { flex:1;overflow-y:auto;padding:6px 0; }

    .nav-chapter { padding:6px 12px 2px; }
    .chapter-btn {
      width:100%; display:flex; align-items:center; gap:8px;
      padding:8px 10px; border:none; background:none; color:var(--text);
      border-radius:10px; cursor:pointer; text-align:left;
      font-size:13px; font-weight:600; transition:background 0.15s;
    }
    .chapter-btn:hover { background:var(--surface2); }
    .chapter-btn .ch-icon { font-size:16px;width:24px;text-align:center;flex-shrink:0; }
    .chapter-btn .ch-arr { margin-left:auto;color:var(--text3);font-size:11px;transition:transform .2s; }
    .chapter-btn.expanded .ch-arr { transform:rotate(90deg); }
    .chapter-sections { display:none; padding:1px 0 4px 42px; }
    .chapter-sections.show { display:block; }
    .section-btn {
      width:100%; padding:6px 8px; border:none; background:none;
      color:var(--text2); border-radius:7px; cursor:pointer;
      text-align:left; font-size:12px; transition:all .15s; line-height:1.3;
    }
    .section-btn:hover { background:var(--surface2);color:var(--text); }
    .section-btn.active { background:rgba(79,142,247,.15);color:var(--accent);font-weight:500; }

    /* ── Main ── */
    .main { flex:1;display:flex;flex-direction:column;overflow:hidden; }
    .content-area {
      flex:1; overflow-y:auto;
      padding:20px 18px;
      padding-bottom:max(90px,calc(env(safe-area-inset-bottom)+90px));
    }
    .content-area h1 { font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.3; }
    .section-meta { font-size:11px;color:var(--text3);margin-bottom:20px;display:flex;align-items:center;gap:6px;flex-wrap:wrap; }
    .meta-tag { background:var(--surface2);border-radius:5px;padding:2px 7px;color:var(--text2); }
    .text-block { margin-bottom:16px; }
    .text-block h2 { font-size:14px;font-weight:600;color:var(--accent);margin-bottom:8px;margin-top:20px; }
    .text-block p { font-size:16px;line-height:1.85;color:var(--text); }
    .text-block ul { padding-left:18px;margin-top:6px; }
    .text-block li { font-size:16px;line-height:1.85;color:var(--text);margin-bottom:2px; }

    /* Sentence click */
    .s { cursor:pointer; border-radius:3px; transition:background .15s; }
    .s:hover { background:rgba(79,142,247,.12); }
    .s.selected { background:rgba(79,142,247,.22); }

    /* Word double-click */
    .w { cursor:pointer; border-radius:2px; transition:background .12s,color .12s; display:inline; }
    .w.selected { background:rgba(124,92,191,.35);color:#d4baff; }

    /* ── Popup ── */
    .popup {
      position:fixed;
      bottom:calc(env(safe-area-inset-bottom) + 70px);
      left:50%; transform:translateX(-50%) translateY(16px);
      width:calc(100% - 28px); max-width:480px;
      background:var(--surface2); border:1px solid var(--border);
      border-radius:var(--radius); padding:14px 14px 14px 16px;
      z-index:300; box-shadow:0 8px 32px rgba(0,0,0,.65);
      transition:opacity .2s,transform .2s;
      opacity:0; pointer-events:none;
    }
    .popup.show { opacity:1;transform:translateX(-50%) translateY(0);pointer-events:all; }
    .popup-header { display:flex;align-items:flex-start;gap:10px;margin-bottom:8px; }
    .popup-type { font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px; }
    .popup-original { font-size:14px;color:var(--text2);font-style:italic;line-height:1.5;flex:1; }
    .btn-speak-popup {
      width:30px;height:30px;border:none;background:var(--surface);
      color:var(--accent);border-radius:50%;cursor:pointer;
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
      transition:background .15s;
    }
    .btn-speak-popup:active { background:var(--border); }
    .btn-speak-popup.speaking { background:rgba(79,142,247,.2); animation:pulse-btn 1s ease-in-out infinite; }
    @keyframes pulse-btn {
      0%,100% { box-shadow:0 0 0 0 rgba(79,142,247,.4); }
      50% { box-shadow:0 0 0 5px rgba(79,142,247,0); }
    }
    .popup-translation { font-size:18px;font-weight:600;color:var(--text);line-height:1.4; }
    .popup-loading { font-size:13px;color:var(--text3); }
    .popup-close {
      position:absolute;top:8px;right:8px;width:22px;height:22px;
      border:none;background:var(--border);color:var(--text2);
      border-radius:50%;cursor:pointer;font-size:12px;
      display:flex;align-items:center;justify-content:center;
    }

    /* ── Hint bar ── */
    .hint-bar {
      position:fixed; bottom:calc(env(safe-area-inset-bottom)+12px);
      left:50%; transform:translateX(-50%);
      display:flex; gap:10px; z-index:100; pointer-events:none;
    }
    .hint {
      background:rgba(19,19,26,.92); border:1px solid var(--border);
      border-radius:20px; padding:5px 12px; font-size:11px;
      color:var(--text3); white-space:nowrap; backdrop-filter:blur(8px);
    }

    /* ── Welcome ── */
    .welcome { display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;text-align:center;padding:28px;color:var(--text2); }
    .welcome-icon { font-size:52px; }
    .welcome h2 { font-size:18px;font-weight:700;color:var(--text); }
    .welcome p { font-size:13px;line-height:1.6;max-width:280px; }

    /* ── Progress ── */
    .progress-bar { height:2px;background:var(--border);flex-shrink:0; }
    .progress-fill { height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s ease; }

    ::-webkit-scrollbar { width:3px; }
    ::-webkit-scrollbar-thumb { background:var(--border);border-radius:2px; }
  </style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="topbar">
  <button class="btn-menu" id="btnMenu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="topbar-title" id="topbarTitle">Samfunnskunnskap</div>
  <button class="btn-speak-all" id="btnSpeakAll">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    </svg>
    Read all
  </button>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<div class="app-body">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">🇳🇴 Samfunnskunnskap</div>
      <div class="sidebar-hint">👆 click → translate sentence<br>✌️ double click → translate word</div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </div>

  <div class="main">
    <div class="content-area" id="contentArea">
      <div class="welcome">
        <div class="welcome-icon">📖</div>
        <h2>Welcome</h2>
        <p>Choose a topic from the left menu. Click a sentence to translate it. Double-click a word to translate just that word.</p>
      </div>
    </div>
  </div>
</div>

<div class="popup" id="popup">
  <div class="popup-header">
    <div>
      <div class="popup-type" id="popupType">sentence</div>
      <div class="popup-original" id="popupOriginal"></div>
    </div>
    <button class="btn-speak-popup" id="btnSpeakPopup">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
    </button>
  </div>
  <div class="popup-translation" id="popupTranslation"><span class="popup-loading">Переводим…</span></div>
  <button class="popup-close" id="popupClose">✕</button>
</div>

<div class="hint-bar">
  <div class="hint">👆 click = sentence</div>
  <div class="hint">✌️ double = word</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// REAL CONTENT from samfunnskunnskap.no
// ═══════════════════════════════════════════════════════════════
const CHAPTERS = [
  {
    id: 'demokrati', title: 'Menneskerettigheter og demokrati', icon: '🏛️',
    sections: [
      {
        id: 'demo-1', title: 'Demokrati',
        content: `<h1>Menneskerettigheter og demokrati</h1>
<div class="section-meta"><span class="meta-tag">Demokrati</span></div>
<div class="text-block">
<p>Norge er et demokrati. Ordet demokrati er opprinnelig gresk og betyr folkestyre. Folket styrer politikken i Norge gjennom å velge representanter fra politiske partier til Stortinget, fylkesting og kommunestyrer. På denne måten bestemmer flertallet av folket. Men et viktig prinsipp er også at flertallet skal ta hensyn til mindretallets meninger når de utformer politikken.</p>
<p>Demokratiske spilleregler og menneskerettigheter utfyller og forsterker hverandre.</p>

      },
      {
        id: 'demo-2', title: 'Menneskerettigheter',
        content: `<h1>Menneskerettigheter</h1>
<div class="section-meta"><span class="meta-tag">Demokrati</span></div>
<div class="text-block">
<p>Menneskerettighetene gjelder for alle mennesker. Dette er rettigheter vi har fordi vi er mennesker – ikke fordi vi bor bestemte steder i verden eller tilhører en bestemt religion eller folkegruppe. Vi sier at menneskerettighetene er universelle.</p>
<p>I 1948 ble FNs verdenserklæring om menneskerettigheter vedtatt. Alle FNs 193 medlemsland har sluttet seg til denne erklæringen. Store deler av FNs menneskerettighetserklæring er innarbeidet i de norske lovene.</p>
<h2>Menneskerettighetserklæringen sier blant annet at</h2>
<ul>
<li>alle mennesker er født frie med samme menneskeverd og menneskerettigheter</li>
<li>alle mennesker har de samme menneskerettighetene uavhengig av kjønn, religion, etnisitet, politisk syn, nasjonalitet osv.</li>
<li>alle mennesker har rett til frihet og personlig sikkerhet</li>
<li>tortur i alle former er forbudt</li>
<li>alle mennesker skal ha rettssikkerhet</li>
<li>alle mennesker har rett til å påvirke den politiske situasjonen i landet sitt gjennom å stemme ved frie, hemmelige valg</li>
</ul>
</div>`
      },
      {
        id: 'demo-3', title: 'Demokratiske rettigheter og plikter',
        content: `<h1>Demokratiske rettigheter og plikter</h1>
<div class="section-meta"><span class="meta-tag">Demokrati</span></div>
<div class="text-block">
<p>Mennesker som bor i et demokrati, har både frihet, ansvar, rettigheter og plikter.</p>
<h2>Ytringsfrihet</h2>
<p>Ytringsfrihet betyr at man fritt kan si sin mening om blant annet politikk og religion, at man fritt kan diskutere med andre, og at man fritt kan skrive om meningene sine uten å bli straffet for dette. Vi har en del lover som setter grenser for ytringsfriheten. Det er for eksempel ikke lov å komme med rasistiske og andre hatefulle ytringer, verken muntlig eller skriftlig.</p>
<h2>Stemmerett</h2>
<p>I et demokrati har innbyggerne rett til å stemme ved politiske valg. Stemmerettsalderen i Norge er i dag 18 år. Valgene er hemmelige. Dette betyr at andre mennesker ikke vet hva det enkelte individet har stemt. For å stemme ved stortingsvalg må du være norsk statsborger. For å stemme ved fylkestings- og kommunestyrevalg må du ha bodd i Norge de siste tre årene før valget.</p>
<h2>Rettssikkerhet</h2>
<p>Rettssikkerhet betyr blant annet at ingen kan dømmes til fengsel uten at det har vært en rettssak først. En rettssak i et demokratisk land innebærer at uavhengige dommere bestemmer om den tiltalte personen er skyldig eller ikke, og at uavhengige dommere bestemmer straffen om den tiltalte blir funnet skyldig. Alle tiltalte har rett til et forsvar.</p>
<h2>Religions- og trosfrihet</h2>
<p>Religions- og trosfrihet betyr at mennesker er frie til å velge hvilken religion eller hvilket livssyn de ønsker å tilhøre, og at de fritt kan praktisere sin religion eller sitt livssyn. Ingen har rett til å tvinge andre inn i eller ut av en religiøs gruppe eller menighet. Fra man er 15 år har man rett til å melde seg inn i eller ut av menigheter på egen hånd.</p>
<h2>Ansvar og plikter</h2>
<p>Som vi ser, har mennesker i et demokrati mange rettigheter. Sammen med frihet og rettigheter kommer også ansvar og plikter. Vi må følge lovene og reglene som flertallet har bestemt. Det norske samfunnet er i stor grad basert på gjensidig tillit. Det betyr at styresmaktene stoler på at innbyggerne oppgir riktig informasjon og følger lover og regler.</p>
</div>`
      },
      {
        id: 'demo-4', title: 'Demokratiet i Norge',
        content: `<h1>Demokratiet i Norge</h1>
<div class="section-meta"><span class="meta-tag">Demokrati</span></div>
<div class="text-block">
<h2>Staten, fylkeskommunene og kommunene</h2>
<p>I Norge er det 15 fylker og 357 kommuner. Fylker og kommuner er både geografiske områder og politisk styrte enheter. Både fylkeskommunene og kommunene har selvbestemmelsesrett i en del saker, selv om staten bestemmer mye. Staten setter rammer for fylkeskommunene og kommunene.</p>
<h2>Stortinget</h2>
<p>Norges nasjonalforsamling heter Stortinget. På Stortinget sitter det 169 representanter som velges av folket for fire år om gangen. Stortingsrepresentantene representerer ulike politiske partier. Stortinget er den øverste statsmakten i Norge. De viktigste oppgavene til Stortinget er å vedta nye lover og forandre gamle lover, å vedta statsbudsjettet og å kontrollere regjeringen.</p>
<h2>Regjeringen</h2>
<p>Etter et stortingsvalg danner ett eller flere partier en ny regjering. Regjeringen består av statsrådene og statsministeren. En av regjeringens oppgaver er å foreslå nye lover og endringer i lovene, men Stortinget vedtar lovene. Regjeringen skal sørge for at de sakene som blir vedtatt i Stortinget, blir gjennomført i praksis.</p>
<h2>Maktfordelingsprinsippet</h2>
<p>Maktfordelingsprinsippet deler makten mellom tre uavhengige myndigheter: en lovgivende myndighet – Stortinget – som vedtar lover, en utøvende myndighet – regjeringen – som foreslår lover og sørger for at de blir iverksatt, og en dømmende myndighet – domstolene – som dømmer i rettssaker. Når makten er fordelt på disse tre myndighetene, får ingen av dem for stor makt alene.</p>
</div>`
      },
      {
        id: 'demo-5', title: 'Valg og politiske partier',
        content: `<h1>Valg og politiske partier</h1>
<div class="section-meta"><span class="meta-tag">Demokrati</span></div>
<div class="text-block">
<p>Annethvert år avholdes det politiske valg i Norge. Det veksler mellom stortingsvalg og lokalvalg (fylkestings- og kommunevalg).</p>
<p>De politiske partiene vedtar et program på landsmøtene sine. I programmet skriver de om hvilke saker de ønsker å jobbe med de neste fire årene, altså i valgperioden som kommer.</p>
<p>Det er hemmelige valg i Norge. Det betyr at vi ikke behøver å fortelle andre hvilket parti vi stemmer på. Det hender ofte at mennesker i samme familie stemmer på forskjellige partier. Det er viktig å ha en selvstendig mening om hvilket parti man støtter.</p>
<h2>Stemmerett</h2>
<p>Stemmerettsalderen i Norge er 18 år. For å stemme ved stortingsvalg må du være norsk statsborger. For å stemme ved kommune- og fylkestingsvalg må du ha bodd i Norge de siste tre årene. Norske menn fikk allmenn stemmerett i 1898, mens norske kvinner fikk allmenn stemmerett i 1913.</p>
<p>Det finnes rundt tjue ulike politiske partier i Norge, så når det er valg, er det mange alternativer å velge mellom.</p>
</div>`
      }
    ]
  },
  {
    id: 'norge', title: 'Dette er Norge', icon: '🇳🇴',
    sections: [
      {
        id: 'norge-1', title: 'Befolkning og bosetting',
        content: `<h1>Dette er Norge</h1>
<div class="section-meta"><span class="meta-tag">Norge</span></div>
<div class="text-block">
<p>Folketallet i Norge øker. Økningen kommer av innvandring og av at det fødes flere enn det dør. I 1970 bodde det i underkant av 3,9 millioner mennesker i landet. I 2025 passerte vi 5,6 millioner. Prognosen er at den norske befolkningen er på 6 millioner mennesker i 2040.</p>
<p>Selv om befolkningen i Norge er sammensatt, er det likevel en del ting som forener oss som nasjon. Verdier, som likestilling og likeverd gjennomsyrer samfunnet, de fleste har en relativt høy materiell levestandard, og utdanningsnivået i befolkningen er ganske høyt.</p>

      {
        id: 'norge-2', title: 'Fakta om Norge',
        content: `<h1>Fakta om Norge</h1>
<div class="section-meta"><span class="meta-tag">Norge</span></div>
<div class="text-block">
<ul>
<li>Norge er et monarki. Statsoverhodet er kong Haakon. Tittelen som monark går i arv.</li>
<li>I Norge bor det 5,6 millioner mennesker (01.01.2026). Omtrent syttifem prosent av innbyggerne bor langs kysten.</li>
<li>Det er to offisielle språk med nasjonal status i Norge, norsk og samisk. Norsk har to skriftspråk, bokmål og nynorsk.</li>

<li>Hovedstaden heter Oslo, det er den største byen i Norge. Oslo har ca. 725 000 innbyggere (2025).</li>

<h2>Landskap</h2>
<p>Norge har store områder med fjell, og det er også mye skog. Store skog- og fjellområder er øde og ubebodde. I noen fjellområder finner vi isbreer der snøen og isen aldri smelter.</p>

<div class="section-meta"><span class="meta-tag">Historie</span></div>
<div class="text-block">
<p>Norge i dag er et moderne og multikulturelt land. Levestandarden er høy, moderne teknologi preger samfunnet. Norge deltar også i internasjonalt samarbeid som har innflytelse på norsk politikk, blant annet FN, NATO og EØS.</p>
<p>De store folkebevegelsene har hatt stor betydning for utviklingen av det moderne Norge. Særlig har arbeiderbevegelsen og kvinnebevegelsen vært sentrale.</p>
<h2>Arbeiderbevegelsen</h2>
<p>Arbeiderbevegelsen i Norge har røtter tilbake til 1600-tallet, men ble mer organisert fra 1880-årene da det ble skapt flere industriarbeidsplasser. Arbeiderbevegelsen har kjempet fram bedre vilkår for arbeiderne, blant annet kortere arbeidsdag, bedre sikkerhetsforhold på arbeidsplassene, sykeforsikringer og rett til økonomisk støtte ved arbeidsledighet. I dag er rundt halvparten av alle arbeidstakere organisert i en fagforening.</p>
<h2>Kvinnebevegelsen</h2>
<p>Kvinnebevegelsen har kjempet for kvinners rettigheter i samfunnet og for like muligheter for menn og kvinner. I Norge var kvinnebevegelsen aktiv fra 1880-årene, og allerede i 1913 fikk kvinner i Norge stemmerett. I 1970-årene skjøt kvinnekampen fart igjen. Retten til skilsmisse, rett til prevensjon, selvbestemt abort og kvinnens rett til å bestemme over sin egen kropp har vært viktige saker for kvinnebevegelsen.</p>
<p>I dag har kvinner og menn lik rett til utdanning og arbeid, til eiendom og arv og medisin og god helse.</p>
<h2>Olje</h2>
<p>I 1960-årene ønsket flere selskaper å lete etter olje og gass utenfor kysten av Norge. I 1967 ble det første gang funnet olje i Nordsjøen, og fra da av utviklet Norge seg til å bli en oljenasjon. Dette har fått stor betydning for norsk økonomi. Oljeressursene ble beholdt i offentlig eie. I dag foregår det en diskusjon i samfunnet om oljeindustrien og hvilke konsekvenser denne industrien har for natur og miljø.</p>
</div>`

<p>Til alle tider har mennesker flyttet på seg og bosatt seg nye steder og i nye land. Det kan være ulike årsaker til dette. Noen flytter på grunn av økonomi, jobb eller kjærlighet, andre flykter fra krig. Noen er eventyrlystne og vil bare ha forandring, eller de vil studere på et spesielt universitet.</p>
<p>Det bor ca. 5,4 millioner mennesker i Norge. Omtrent én million av disse er født i utlandet eller har foreldre som er født i utlandet. Det utgjør ca. atten prosent av befolkningen i Norge. Rundt halvparten av innvandrerne i Norge har norsk statsborgerskap.</p>

// ═══════════════════════════════════════════════════════════════
// LOAD SECTION
// ═══════════════════════════════════════════════════════════════
function loadSection(ch, sec) {
  currentSection = sec;
  stopSpeaking(); hidePopup();

  document.querySelectorAll('.section-btn').forEach(b => b.classList.toggle('active', b.dataset.id === sec.id));
  document.getElementById('topbarTitle').textContent = sec.title;

  const area = document.getElementById('contentArea');
  area.innerHTML = sec.content;
  wrapContent(area);
  area.scrollTop = 0;
  updateProgress();
}

// ═══════════════════════════════════════════════════════════════
// WRAP — sentences clickable, words double-clickable
// ═══════════════════════════════════════════════════════════════
function wrapContent(container) {
  container.querySelectorAll('p, li').forEach(el => {
    el.innerHTML = wrapParagraphHTML(el.innerHTML);
  });

  // Single click on sentence → translate sentence
  container.querySelectorAll('.s').forEach(s => {
    s.addEventListener('click', e => {
      if (e.detail === 2) return; // let dblclick handle it
      e.stopPropagation();
      clearSelections();
      s.classList.add('selected');
      const text = s.textContent.trim();
      if (text) showTranslation(text, 'предложение', () => speak(text));
    });

    // Double click on sentence → translate word
    s.addEventListener('dblclick', e => {
      e.stopPropagation();
      const sel = window.getSelection();
      let word = sel ? sel.toString().trim() : '';
      // If no text selected, try to get the word from target
      if (!word && e.target.classList.contains('w')) {
        word = e.target.textContent.replace(/[.,!?;:»«"')(]/g,'').trim();
      }
      if (!word) return;
      clearSelections();
      if (e.target.classList.contains('w')) e.target.classList.add('selected');
      showTranslation(word, 'слово', () => speak(word));
    });
  });
}

function wrapParagraphHTML(html) {
  // Split into sentences, wrap each sentence in .s, words in .w
  const sentences = html.split(/(?<=[.!?»])\s+/);
  return sentences.map(sent => {
    if (!sent.trim()) return sent;
    const words = sent.replace(/(\w[\w'-]*)/g, '<span class="w">$1</span>');
    return `<span class="s">${words}</span> `;
  }).join('');
}

function clearSelections() {
  document.querySelectorAll('.s.selected,.w.selected').forEach(el => el.classList.remove('selected'));
}

// Close popup on tap outside
document.getElementById('contentArea').addEventListener('click', e => {
  if (!e.target.closest('.s')) hidePopup();
});

// ═══════════════════════════════════════════════════════════════
// TRANSLATION — tries multiple free APIs
// ═══════════════════════════════════════════════════════════════
async function translateText(text) {
  const key = text.trim().toLowerCase().substring(0, 200);
  if (translateCache[key]) { setTranslation(translateCache[key]); return; }

  setTranslation('<span class="popup-loading">Переводим…</span>');

  // Try MyMemory first
  try {
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=no|ru&de=app@norsk.app`);
    const d = await r.json();
    if (d.responseStatus === 200 && d.responseData?.translatedText) {
      let t = d.responseData.translatedText;
      if (!t.toLowerCase().includes('mymemory') && !t.toLowerCase().includes('quota')) {
        translateCache[key] = t;
        setTranslation(t);
        return;
      }
    }
  } catch(_) {}

  // Fallback: Lingva (open source Google Translate frontend)
  try {
    const r = await fetch(`https://lingva.ml/api/v1/no/ru/${encodeURIComponent(text)}`);
    const d = await r.json();
    if (d.translation) {
      translateCache[key] = d.translation;
      setTranslation(d.translation);
      return;
    }
  } catch(_) {}

  setTranslation('⚠️ Нет соединения с переводчиком');
}

function showTranslation(text, type, speakFn) {
  document.getElementById('popupType').textContent = type;
  document.getElementById('popupOriginal').textContent = text;
  document.getElementById('btnSpeakPopup').onclick = () => {
    speakFn();
    const b = document.getElementById('btnSpeakPopup');
    b.classList.add('speaking');
    setTimeout(() => b.classList.remove('speaking'), 2000);
  };
  document.getElementById('popup').classList.add('show');
  translateText(text);
}

function hidePopup() {
  document.getElementById('popup').classList.remove('show');
  clearSelections();
}

function setTranslation(html) {
  document.getElementById('popupTranslation').innerHTML = html;
}

document.getElementById('popupClose').onclick = hidePopup;

// ═══════════════════════════════════════════════════════════════
// SPEECH — Norwegian TTS
// ═══════════════════════════════════════════════════════════════
function speak(text) {
  if (!window.speechSynthesis) return;
  stopSpeaking();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'nb-NO'; u.rate = 0.88; u.pitch = 1.0;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v => v.lang.startsWith('nb') || v.lang.startsWith('no'));
  if (v) u.voice = v;
  currentSpeak = u;
  window.speechSynthesis.speak(u);
}

function stopSpeaking() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  currentSpeak = null;
  document.getElementById('btnSpeakAll').classList.remove('speaking');
}

document.getElementById('btnSpeakAll').addEventListener('click', function() {
  if (this.classList.contains('speaking')) { stopSpeaking(); return; }
  if (!currentSection) return;
  const text = document.getElementById('contentArea').innerText;
  if (!text) return;
  this.classList.add('speaking');
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'nb-NO'; u.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v => v.lang.startsWith('nb') || v.lang.startsWith('no'));
  if (v) u.voice = v;
  u.onend = u.onerror = () => this.classList.remove('speaking');
  window.speechSynthesis.speak(u);
});

if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => {};

// ═══════════════════════════════════════════════════════════════
// SIDEBAR MOBILE
// ═══════════════════════════════════════════════════════════════
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('btnMenu').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
});
document.getElementById('overlay').addEventListener('click', closeSidebar);

// ═══════════════════════════════════════════════════════════════
// PROGRESS
// ═══════════════════════════════════════════════════════════════
function updateProgress() {
  const all = CHAPTERS.flatMap(c => c.sections.map(s => s.id));
  const idx = all.indexOf(currentSection?.id);
  document.getElementById('progressFill').style.width = idx >= 0 ? ((idx+1)/all.length*100)+'%' : '0%';
}

// ═══════════════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePopup(); });

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
buildSidebar();
loadSection(CHAPTERS[0], CHAPTERS[0].sections[0]);
</script>
