<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Make Icons</title></head>
<body style="background:#111;display:flex;gap:16px;padding:20px;align-items:flex-start">
<div>
  <canvas id="c192" width="192" height="192"></canvas><br>
  <button onclick="dl('c192','icon-192.png')" style="margin-top:8px">Download 192</button>
</div>
<div>
  <canvas id="c512" width="512" height="512"></canvas><br>
  <button onclick="dl('c512','icon-512.png')" style="margin-top:8px">Download 512</button>
</div>
<script>
function draw(canvas) {
  const S = canvas.width;
  const ctx = canvas.getContext('2d');

  // Background — deep navy gradient
  const bg = ctx.createRadialGradient(S*.5,S*.4,0, S*.5,S*.5,S*.72);
  bg.addColorStop(0,'#1a2240');
  bg.addColorStop(1,'#0a0d1a');
  ctx.fillStyle = bg;
  roundRect(ctx,0,0,S,S,S*.13); ctx.fill();

  const cx=S/2, cy=S/2;

  // ── Norwegian flag (bold, centered-top) ──
  const fw=S*.46, fh=S*.32, fx=cx-fw/2, fy=S*.1;
  // Red field
  ctx.fillStyle='#EF2B2D';
  ctx.beginPath(); roundRect(ctx,fx,fy,fw,fh,S*.025); ctx.fill();
  // White cross
  const cw=fw*.18, ch=fh*.22;
  ctx.fillStyle='#fff';
  ctx.fillRect(fx, fy+fh/2-ch/2, fw, ch);         // horizontal
  ctx.fillRect(fx+fw*.32, fy, cw, fh);             // vertical
  // Blue cross (thinner, inside white)
  const bw=fw*.10, bh=fh*.12;
  ctx.fillStyle='#002868';
  ctx.fillRect(fx, fy+fh/2-bh/2, fw, bh);
  ctx.fillRect(fx+fw*.36, fy, bw, fh);

  // ── Open book ──
  const bx=cx, by=S*.64;
  const bw2=S*.48, bh2=S*.28;

  // Shadow
  ctx.shadowColor='rgba(79,142,247,.35)';
  ctx.shadowBlur=S*.06;

  // Left page
  ctx.fillStyle='#1e2d50';
  ctx.beginPath();
  ctx.moveTo(bx,by-bh2/2);
  ctx.quadraticCurveTo(bx-bw2*.5,by-bh2*.6, bx-bw2*.5,by);
  ctx.quadraticCurveTo(bx-bw2*.5,by+bh2*.6, bx,by+bh2/2);
  ctx.closePath(); ctx.fill();

  // Right page
  ctx.fillStyle='#162440';
  ctx.beginPath();
  ctx.moveTo(bx,by-bh2/2);
  ctx.quadraticCurveTo(bx+bw2*.5,by-bh2*.6, bx+bw2*.5,by);
  ctx.quadraticCurveTo(bx+bw2*.5,by+bh2*.6, bx,by+bh2/2);
  ctx.closePath(); ctx.fill();

  ctx.shadowBlur=0;

  // Spine line
  ctx.strokeStyle='#4f8ef7'; ctx.lineWidth=S*.012;
  ctx.beginPath(); ctx.moveTo(bx,by-bh2/2); ctx.lineTo(bx,by+bh2/2); ctx.stroke();

  // Text lines on left page
  const lc='rgba(79,142,247,.5)', lh=S*.013, lg=S*.038;
  [-2,-1,0,1,2].forEach(i=>{
    const lw2 = i===2?bw2*.22:i===-2?bw2*.3:bw2*.35;
    ctx.fillStyle=i===-2?'rgba(79,142,247,.85)':lc;
    roundRect(ctx,bx-bw2*.44,by+i*lg-lh/2,lw2,lh,lh/2); ctx.fill();
  });
  // Text lines on right page
  [-2,-1,0,1,2].forEach(i=>{
    const lw2 = i===2?bw2*.18:i===0?bw2*.28:bw2*.33;
    ctx.fillStyle=lc;
    roundRect(ctx,bx+bw2*.08,by+i*lg-lh/2,lw2,lh,lh/2); ctx.fill();
  });

  // Glow dot at spine-top
  const grd=ctx.createRadialGradient(bx,by-bh2/2,0,bx,by-bh2/2,S*.04);
  grd.addColorStop(0,'rgba(79,142,247,.8)');
  grd.addColorStop(1,'rgba(79,142,247,0)');
  ctx.fillStyle=grd;
  ctx.beginPath(); ctx.arc(bx,by-bh2/2,S*.04,0,Math.PI*2); ctx.fill();
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function dl(id,name){
  const a=document.createElement('a');
  a.download=name;
  a.href=document.getElementById(id).toDataURL('image/png');
  a.click();
}

draw(document.getElementById('c192'));
draw(document.getElementById('c512'));
</script>
</body>
</html>
